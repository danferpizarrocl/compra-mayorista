<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e8a90">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mayorista">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mi Super</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de celular de una columna. Tarjeta grande de total al inicio de Buscar; al bajar queda una franja fija.
   Paleta de la planilla: azul de encabezados (#0070C0) y dorado de la celda TOTAL. Series del gráfico validadas en ambos temas. */
:root{
  --bg:#eef1f5;--surface:#ffffff;--surface2:#f3f6fa;--ink:#101a2b;--muted:#5b6a82;--line:#dbe2ec;
  --accent:#0070c0;--accent-ink:#ffffff;--accent-soft:#e1effa;
  --lvg:#15803d;--lvy:#a87400;--lvo:#d1560a;--budred:#d00000;--gold:#ffc000;--gold-ink:#3a2a00;--bad:#c62828;--bad-soft:#fde8e8;--ok:#177a4c;
  --s1:#0070c0;--s2:#c46a00;--s3:#7b8799;
  --shadow:0 1px 2px rgba(16,26,43,.06),0 6px 18px rgba(16,26,43,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220;--surface:#141d2f;--surface2:#1a2540;--ink:#e8eef9;--muted:#95a3bc;--line:#25314c;
  --accent:#4aa8f2;--accent-ink:#04182b;--accent-soft:#123049;
  --lvg:#4ade80;--lvy:#facc15;--lvo:#fb923c;--budred:#ff4d4d;--gold:#ffc83d;--gold-ink:#2e2100;--bad:#ff8080;--bad-soft:#3a1a22;--ok:#4cd69a;
  --s1:#3b9be6;--s2:#d07f28;--s3:#8c9ab1;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220;--surface:#141d2f;--surface2:#1a2540;--ink:#e8eef9;--muted:#95a3bc;--line:#25314c;
  --accent:#4aa8f2;--accent-ink:#04182b;--accent-soft:#123049;
  --lvg:#4ade80;--lvy:#facc15;--lvo:#fb923c;--budred:#ff4d4d;--gold:#ffc83d;--gold-ink:#2e2100;--bad:#ff8080;--bad-soft:#3a1a22;--ok:#4cd69a;
  --s1:#3b9be6;--s2:#d07f28;--s3:#8c9ab1;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;font-variant-numeric:tabular-nums}
body.sch #main .rw{display:none}
body.kb #main{padding-bottom:calc(var(--kb,0px) + 160px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto}
svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
.top h1{font-size:20px;font-weight:800}
.sub{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ib:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top-btns{display:flex;gap:4px;flex:none}
.top-btns .ib{width:36px;height:36px;border-radius:11px}
.top>div:first-child{flex:1}
.top h1{white-space:nowrap}
@media (max-width:430px){.top h1{font-size:18px}}
/* franja fija con total */
.strip{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:8px 14px 10px;margin-bottom:12px;box-shadow:var(--shadow);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.strip .r{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.strip small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.strip b{font-family:var(--f-display);font-size:19px;font-weight:800}
.strip .rt{text-align:right}
.strip.over{background:var(--bad);color:#fff}
.strip .bar{height:4px;margin-top:6px}
.strip.fx{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto;transform:translateY(-160%);transition:transform .22s;z-index:55}
.strip.fx.show{transform:none}
@media (prefers-reduced-motion:reduce){.strip.fx{transition:none}}
.bar{height:7px;border-radius:7px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:7px;width:0;transition:width .25s}
.demo{background:var(--gold);color:var(--gold-ink);border-radius:14px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px}
.demo button{background:var(--gold-ink);color:var(--gold);border-radius:10px;padding:7px 11px;font-weight:700;white-space:nowrap}
.cartsw{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.cartsw button{flex:1;padding:8px 6px;border-radius:10px;color:var(--muted);font-size:13px;text-align:center;min-width:0}
.cartsw button b{display:block;font-family:var(--f-display);font-size:15px;color:var(--ink)}
.cartsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cartsw button[aria-pressed="true"] b{color:var(--accent-ink)}
/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);position:relative}
.card h2,.budc label.h2l{font-size:16px;color:var(--ink);font-weight:700;margin:0 0 12px;font-family:var(--f-display);display:block;line-height:1.25;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:6px;padding-right:76px}
.card h2 svg,.budc label.h2l svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;margin-right:6px;stroke-opacity:1}
.budc label.h2l{padding-right:0}
.bigc .allc{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.bigc .allc .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bigc .allc .row span{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.bigc .allc .row b{font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.bigc .allc small{display:block;margin-top:2px;font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0}
.bigc .h2l{display:block;font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--ink);line-height:1.25;margin:0 0 6px;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:6px}
.bigc .h2l svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;margin-right:6px}
.bigc.lv-r .h2l{color:var(--ink)}
.h2in{font:inherit;color:inherit;background:var(--surface2);border:1px dashed var(--accent);border-radius:8px;padding:2px 8px;width:calc(100% - 34px);text-decoration:none;min-width:0}
.exrow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.exrow:last-child{border-bottom:0}
.exrow input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.exrow .n{flex:1;min-width:0}.exrow .am{font-family:var(--f-display);font-weight:700}
.cdisp{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-top:10px;text-align:right;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.cdisp .ex{font-size:15px;color:var(--muted);min-height:20px;word-break:break-all}
.cdisp .rs{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.02em;word-break:break-all;line-height:1.1}
.chist{margin-top:14px}.chist .hh{display:flex;align-items:center;justify-content:space-between;gap:10px}.chist .hh b{font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.chist .hh button{font-size:13px;font-weight:700;color:var(--bad);padding:6px 8px;border-radius:8px}
.chist .hl{max-height:170px;overflow-y:auto;margin-top:4px;border-top:1px solid var(--line)}
.chist .hl button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.chist .hl .x{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chist .hl .r{font-family:var(--f-display);font-weight:800;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ckeys button{height:54px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--ink);display:grid;place-items:center}
.ckeys button:active{filter:brightness(.92)}
.ckeys .kop{background:var(--accent-soft);color:var(--accent)}
.ckeys .keq{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.ckeys .keq{grid-row:span 2;height:auto}.ckeys .kz{grid-column:span 2}
.ckeys .kye{background:rgba(255,192,0,.2);color:var(--lvy);border-color:rgba(255,192,0,.45)}
.ckeys .kcl{background:var(--bad-soft);color:var(--bad)}
.ckeys svg{width:22px;height:22px}
.exrow.hr{position:relative;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:11px 8px;border-radius:10px;border-bottom:0;margin:2px 0}
.exrow.hr .fillr{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent-soft)}
.exrow.hr.holding .fillr{width:100%;transition:width .45s linear}
.exrow.hr>*:not(.fillr){position:relative}
.exrow.hr.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.exrow .mk{width:20px;height:20px;color:var(--accent);flex:none;display:grid;place-items:center}
.exrow .mk svg{width:20px;height:20px;stroke-width:2.6}
.exbar .chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px}.exbar .chip svg{width:16px;height:16px}
.exbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.exlist{max-height:230px;overflow-y:auto;margin-top:4px;border:1px solid var(--line);border-radius:12px;padding:2px 10px}
.exsheet{margin-top:14px;padding-top:4px;border-top:2px solid var(--line)}
.exsheet:first-of-type{border-top:0}
.cartsw button{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.extot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.extot span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.extot b{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.tw tfoot td{font-weight:800;background:var(--surface2)}
.mv{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:2}
.mv button{width:34px;height:34px;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);display:grid;place-items:center}
.rw{position:relative;margin-bottom:12px}
.bigc{--lv:var(--lvg);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:12px 16px 13px;box-shadow:var(--shadow)}
.bigc.lv-g{--lv:var(--lvg)}.bigc.lv-y{--lv:var(--lvy)}.bigc.lv-o{--lv:var(--lvo)}
.bigc .ctx{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.bigc .bigv,.bigc .bigq,.bigc .bigq b{color:var(--lv)}
.bigc .bar i{background:var(--lv)}
.bigc.lv-r{--lv:var(--budred)}
.bigc.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:20;margin-bottom:12px}
.bigc.stick .bar{margin-top:8px}.bigc.stick .bigq{margin-top:6px}
.bigc small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.bigv,.budrow input{font-size:40px!important}
.bigv{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1.05;margin-top:4px;overflow-wrap:anywhere}
.bigq{font-size:13px;margin-top:8px;opacity:.95}
.bigq b{font-family:var(--f-display);font-size:15px}
.rw .budc{margin-top:0}
.budc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px;box-shadow:var(--shadow)}
.budc label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.budrow{display:flex;align-items:center;gap:8px}
.budrow input{flex:1;min-width:0;color:var(--budred);letter-spacing:-.03em;font-family:var(--f-display);font-weight:800;font-size:40px;background:transparent;border:2px solid transparent;border-radius:12px;padding:4px 8px;margin-left:-8px}
.budrow input:read-only{pointer-events:none}
.budrow input:not(:read-only){background:var(--surface2);border-color:var(--accent)}
.lockic{color:var(--muted);display:grid;place-items:center;width:34px;height:34px}
.stats2{display:flex;gap:18px;margin-top:8px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.stats2 b{color:var(--ink);font-family:var(--f-display);font-size:15px}
.inp{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.inp:focus{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.inp[readonly]{caret-color:transparent}
.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:0 12px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;background:none;border:0;padding:13px 0;font-size:16px;outline:0}
.chips{display:flex;gap:6px;margin:10px 0 4px;flex-wrap:wrap}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.list{margin:6px -4px 0}
.it{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 4px;border-top:1px solid var(--line);min-height:52px}
.it:first-child{border-top:0}
.it .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.it .h{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}
.pill{flex:none;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 11px}
.pill.add{color:var(--accent);border:1px dashed var(--accent)}
.pill.in{background:var(--accent-soft);color:var(--accent);display:inline-flex;gap:4px;align-items:center}
.pill.in svg{width:14px;height:14px}
.new{width:100%;margin-top:10px;border:1.5px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:14px;padding:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}
.cl{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.cl:first-child{border-top:0}
.cl .tx{flex:1;min-width:0;text-align:left}
.cl b{display:block;overflow-wrap:anywhere}
.cl em{font-style:normal;color:var(--muted);font-size:12.5px}
.cl .am{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--accent);white-space:nowrap}
.chg{font-size:11.5px;font-weight:700;margin-left:6px;white-space:nowrap}
.chg.up{color:var(--bad)}.chg.dn{color:var(--ok)}
.rm{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.rkrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}.rkrow:last-child{border-bottom:0}.rkn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font:800 13px var(--f-display);background:var(--surface2);color:var(--muted)}.rkt{flex:1;min-width:0}.rkname{font-weight:700;font-size:14px}.rksub{font-size:12px;color:var(--muted)}.rkr{text-align:right}.rkr b{font:800 15px var(--f-display)}.rkp{font-size:12px;font-weight:800}
.pal{margin-top:10px;border-radius:14px;padding:10px 12px;font-size:13.5px}.pal.up{background:rgba(255,160,0,.14);border:1.5px solid var(--lvo)}.pal.up b{color:var(--lvo)}.pal.dn{background:rgba(30,160,90,.1);border:1.5px solid var(--lvg)}.pal.dn b{color:var(--lvg)}.pal span{color:var(--muted)}
.kgb{border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:10px}.kgb.best{border-color:var(--lvg);background:rgba(30,160,90,.08)}.kgb .res{margin-top:8px;font-family:var(--f-display);font-weight:800;font-size:22px}.kgb.best .res{color:var(--lvg)}.kgb .res small{font-size:13px;color:var(--muted);font-weight:600}
.kgv{margin-top:12px;background:var(--surface2);border-radius:14px;padding:11px 13px;font-size:14px;min-height:20px}
.bnr{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px;display:flex;flex-direction:column;gap:8px}.bnr .r{display:flex;gap:8px}.bnr button{border-radius:10px;padding:8px 11px;font-weight:700;flex:1}.bnr .p{background:var(--bad);color:#fff}.bnr .s{border:1px solid var(--bad);flex:none}
.dot{position:absolute;top:6px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--bad)}
.sec2{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:14px 0 2px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--accent-ink);margin-top:10px;min-height:48px}
.btn.s{background:var(--surface2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.d{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hold{position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--gold);opacity:.9}
.hold.holding .fill{width:100%;transition:width 2s linear}
.hold.holding{color:var(--gold-ink)}
.hold span.lbl{position:relative;display:flex;gap:8px;align-items:center}

function lastFor(it){var r=lm()[canon(it.name)];if(r)return r;if(S.last){if(S.last[it.name])return S.last[it.name];var al=it.alias||[];for(var i=0;i<al.length;i++)if(S.last[al[i]])return S.last[al[i]]}return null}

function tagColor(tag){var i=S.names.indexOf(tag);return i===0?'var(--s1)':i===1?'var(--s2)':'var(--s3)'}
function histList(){return S.history.filter(function(h){return HF==='todas'||h.tag===HF})}
function niceStep(max){var p=Math.pow(10,Math.floor(Math.log10(max||1))),c=[1,2,2.5,5,10];for(var i=0;i<c.length;i++){if(max/(c[i]*p)<=4)return c[i]*p}return 10*p}
function kfmt(v){return v===0?'$0':v>=1e6?'$'+(v/1e6).toString().replace('.',',')+' M':'$'+(v/1000)+' mil'}
function barPath(x,y,w,h,r){r=Math.max(0,Math.min(r,h,w/2));return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'}
function chartHTML(){
  var list=histList().slice().sort(function(a,b){return a.ts-b.ts});
  if(list.length<1)return '<p class="empty">Cuando finalices una compra o cargues tu Excel, verás aquí cómo ha ido tu gasto.</p>';
  var vals=list.map(function(h){return hTotal(h)}),max=Math.max.apply(null,vals),step=niceStep(max),top=Math.ceil(max/step)*step;
  var slot=34,bw=22,L=0,R=12,H=210,pt=14,pb=30,ph=H-pt-pb,W=L+list.length*slot+R,svg='',ax='';
  for(var v=0;v<=top;v+=step){var y=pt+ph-v/top*ph;svg+='<line class="gl" x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'"/>';ax+='<text class="ax" x="52" y="'+(y+3.5)+'" text-anchor="end">'+kfmt(v)+'</text>'}
  list.forEach(function(h,i){var x=L+i*slot+(slot-bw)/2,bh=vals[i]/top*ph,y=pt+ph-bh,sel=CHSEL===h.id;
    svg+='<path d="'+barPath(x,y,bw,bh,4)+'" style="fill:'+tagColor(h.tag)+(CHSEL&&!sel?';opacity:.45':'')+'"/>';
    svg+='<text class="ax" x="'+(x+bw/2)+'" y="'+(H-pb+14)+'" text-anchor="middle">'+MES[new Date(h.ts).getMonth()]+'</text>';
    if(i===0||new Date(h.ts).getMonth()===0||new Date(list[i-1].ts).getFullYear()!==new Date(h.ts).getFullYear())svg+='<text class="ax" x="'+(x+bw/2)+'" y="'+(H-pb+26)+'" text-anchor="middle">'+new Date(h.ts).getFullYear()+'</text>';
    svg+='<rect class="bhit" data-a="bar" data-id="'+h.id+'" x="'+(L+i*slot)+'" y="0" width="'+slot+'" height="'+(H-pb)+'"/>'});
  var tags=[];list.forEach(function(h){if(tags.indexOf(h.tag)<0)tags.push(h.tag)});
  var leg=tags.length>1?'<div class="leg">'+tags.map(function(t){return '<span><i style="background:'+tagColor(t)+'"></i>'+esc(t)+'</span>'}).join('')+'</div>':'';
  var sel=CHSEL&&S.history.find(function(h){return h.id===CHSEL});
  var info=sel?'<b>'+esc(sel.name)+'</b> · '+esc(sel.tag)+' · '+money(hTotal(sel))+' · '+(sel.sd?'sin detalle':sel.lines.length+' productos'):'Toca una barra para ver el detalle.';
  return leg+'<div class="chw"><svg class="cax" aria-hidden="true" viewBox="0 0 56 '+H+'" style="width:56px;height:'+H+'px">'+ax+'</svg><div class="chs" id="chs"><svg role="img" aria-label="Gasto por compra, de '+money(Math.min.apply(null,vals))+' a '+money(max)+'" viewBox="0 0 '+W+' '+H+'" style="width:'+W+'px;height:'+H+'px">'+svg+'</svg></div></div><div class="cinfo" id="cinfo">'+info+'</div>'}
function rankHTML(){

var CALC={e:'',done:false};
function calcEval(e){var t=e.match(/\d+\.?\d*|\.\d+|[+\-*\/]/g)||[];if(!t.length)return null;

  while(t.length&&/^[+\-*\/]$/.test(t[t.length-1]))t.pop();if(!t.length)return null;
  var nums=[parseFloat(t[0])],ops=[];if(isNaN(nums[0]))return null;
  for(i=1;i<t.length;i+=2){var op=t[i],n=parseFloat(t[i+1]);if(isNaN(n))return null;
    if(op==='*'||op==='/'){var a=nums.pop();if(op==='/'&&n===0)return 'err';nums.push(op==='*'?a*n:a/n)}else{ops.push(op);nums.push(n)}}

 xltog:function(t){var c=$('#'+(t.dataset.c||'xl-hist'));c.checked=!c.checked;t.classList.toggle('off',!c.checked)},
 xlapply:function(){
   var sh=XL[parseInt($('#xl-sheet').value,10)],items=sheetItems(sh);if(!items){toast('Esa hoja no tiene la columna “Item”');return}
   var old={},am=aliasMapFor(S.items);S.items.forEach(function(i){old[sk(i.name)]=i});var list=[],seen={};
   items.forEach(function(x){var k0=sk(x.name),k=am[k0]||k0;if(seen[k])return;seen[k]=1;var o=old[k];list.push(o?{id:o.id,name:(sk(o.name)===k0?x.name:o.name),alias:o.alias}:{id:uid(),name:x.name})});
   var inCart={};if(S.session)S.session.carts.forEach(function(c){Object.keys(c.cart).forEach(function(id){inCart[id]=1})});
   Object.keys(inCart).forEach(function(id){if(!list.some(function(i){return i.id===id})){var o=itemById(id);if(o)list.push(o)}});
   var amL=aliasMapFor(list),last={};XL.forEach(function(s){var p=sheetPurchase(s);if(!p)return;p.lines.forEach(function(l){var k=amL[sk(l.name)]||sk(l.name),it=list.find(function(i){return sk(i.name)===k});if(it&&!last[it.name])last[it.name]={p:l.price,u:l.units,b:l.boxes,s:s.name.trim()}})});
   var added=0,bad=0;
   var haveH={},upd=0;S.history.forEach(function(h){if(h.src==='xl')haveH[norm(h.name)]=h});
   if($('#xl-upd')&&$('#xl-upd').checked){XL.forEach(function(s){var p=sheetPurchase(s),h=p&&haveH[norm(s.name)];if(!h)return;if(JSON.stringify(h.lines)!==JSON.stringify(p.lines)){h.lines=p.lines;h.xlTotal=p.xl;upd++}})}
   if($('#xl-hist').checked){var have={};Object.keys(haveH).forEach(function(k){have[k]=1});
     XL.forEach(function(s,i){var p=sheetPurchase(s);if(!p||have[norm(s.name)])return;var m=sheetMeta(s.name,i);
       if(p.xl>0&&p.xl!==linesTotal(p.lines))bad++;
       S.history.push({id:uid(),name:s.name.trim(),tag:m.tag,ts:m.ts,approx:true,lines:p.lines,budget:null,xlTotal:p.xl,src:'xl'});added++});
     S.history.sort(function(a,b){return b.ts-a.ts})}
   var pr=PAYX?applyPay(PAYX):null;PAYX=null;
   S.items=list;S.last=last;LM=AL=null;save();closeOv();render();
   toast((pr&&payToast(pr)?payToast(pr)+' · ':'')+list.length+' productos cargados'+(added?' y '+added+' compras al historial':'')+(upd?(added?', ':' y ')+upd+(upd===1?' compra actualizada':' compras actualizadas'):'')+(bad?' ('+bad+' con diferencia de total)':''))}
};

document.addEventListener('input',function(e){var t=e.target,id=t.id;
  if(id==='q'){Q=t.value;renderResults()}
  else if(id&&/^kg-[ab][pq]$/.test(id)&&KG){var kk=id.charAt(3);if(id.charAt(4)==='p'){var dd=num(t.value);KG[kk].p=dd?String(dd):'';t.value=dd?'$'+grp(dd):''}else{t.value=t.value.replace(/[^\d.,]/g,'');KG[kk].q=t.value}kgUpdate()}
  else if((id==='paid-s'||id==='paid-h')&&t.dataset.id){var hh=S.history.find(function(x){return x.id===t.dataset.id});if(hh){var pd=num(t.value);hh.paid=pd>0?pd:null;t.value=pd?'$'+grp(pd):'';var pe=$('#paid-d');if(pe)pe.innerHTML=discTxt(hh.sd?0:linesTotal(hh.lines),hh.paid);save()}}
  else if(id==='f-name'&&SH){SH.name=t.value;updCalc()}
  else if(id==='f-price'&&SH){var d=num(t.value);SH.price=d?String(d):'';t.value=d?'$'+grp(d):'';updCalc()}
  else if(id==='r-bud'){var b=num(t.value),c=C();if(c){c.budget=b;S.budget=b;c.overShown=overOf(c)}t.value=b?'$'+grp(b):'';save();var g=function(x,y){return x},tt=totalsOf(c);updateTotalsOnly(t)}
  else if(t.dataset.a==='ttl'){var v=t.value.trim();if(v)S.titles[t.dataset.k]=v;else delete S.titles[t.dataset.k];save()}
  else if(t.dataset.a==='exname'){EX.names[t.dataset.s]=t.value}
  else if(t.dataset.a==='ren'){var it=itemById(t.dataset.id);if(it&&t.value.trim()){it.name=t.value;LM=AL=null;save()}}
  else if(t.dataset.a==='rnname'){var i=parseInt(t.dataset.i,10);if(t.value.trim()){S.names[i]=t.value.trim();save()}}
});

document.addEventListener('change',async function(e){var t=e.target;
  if(t.id==='paid-s'||t.id==='paid-h'){var y0=window.scrollY;render();window.scrollTo(0,y0);return}
  if(t.classList&&t.classList.contains('sugck')){sugCount();return}
  if(t.dataset.a==='exsel'){var cur=exSel().slice(),k=cur.indexOf(t.value);if(t.checked&&k<0)cur.push(t.value);else if(!t.checked&&k>=0)cur.splice(k,1);EX.sel=cur;var y=window.scrollY;renderExport();window.scrollTo(0,y)}
  else if(t.id==='xl-file'&&t.files[0]){
    var box=$('#xl-box');box.innerHTML='<p class="note">Leyendo tu Excel…</p>';
    try{XL=await readXlsx(t.files[0]);BKX=null;var bi=XL.findIndex(function(x){return x.name==='respaldo_app'});if(bi>=0){var rs=XL[bi].rows,ks=Object.keys(rs).map(Number).sort(function(a,b){return a-b}).filter(function(k){return k>1});BKX=ks.map(function(k){return rs[k].A||''}).join('');XL.splice(bi,1)}
      PAYX=null;var pi=XL.findIndex(function(x){return norm(x.name).replace(/\s+/g,'')==='pagadoencaja'});if(pi>=0){PAYX=XL[pi];XL.splice(pi,1)}
      var pbx=PAYX?'<div class="card" style="margin:8px 0;box-shadow:none"><b>Este Excel trae «Pagado en caja»</b><p class="note" style="margin:4px 0 0">Se anota lo que pagaste en las compras que ya tienes y se agregan como «sin detalle» las que no estén.</p>'+(XL.length?'':'<button class="btn" data-a="payapply">Aplicar pagos</button>')+'</div>':'';
      var rbox=BKX?'<div class="card" style="margin:8px 0;box-shadow:none"><b>Este Excel trae un respaldo de la app</b><p class="note" style="margin:4px 0 0">Puedes recuperar todo (productos, compras guardadas y ajustes) o usar el archivo solo para cargar la lista y las compras.</p><button class="btn s" data-a="xlrestore">Restaurar todo desde el respaldo</button></div>':'';
      var def=XL.findIndex(function(s){return /oct|20\d\d/i.test(s.name)&&!/xx/i.test(s.name)&&sheetItems(s)});if(def<0)def=0;
      if(!XL.length){box.innerHTML=(rbox+pbx)||'<p class="err">Ese archivo no tiene hojas con productos.</p>';return}
      box.innerHTML=rbox+pbx+'<div class="card" style="margin:8px 0;box-shadow:none"><label class="fl" for="xl-sheet" style="margin-top:0">Hoja con la lista de productos</label><select class="inp" id="xl-sheet">'+XL.map(function(s,i){return '<option value="'+i+'"'+(i===def?' selected':'')+'>'+esc(s.name.trim())+'</option>'}).join('')+'</select>'
       +'<button class="srow" data-a="xltog" aria-pressed="true"><span class="l">Importar compras al historial<small>Cada hoja con productos pasa a ser una compra antigua</small></span><span class="sw sw-s"></span></button><input type="checkbox" id="xl-hist" checked hidden><button class="srow" data-a="xltog" data-c="xl-upd" aria-pressed="true"><span class="l">Actualizar compras ya importadas<small>Si corregiste una hoja en tu Excel, se cambia también en el historial</small></span><span class="sw sw-s"></span></button><input type="checkbox" id="xl-upd" checked hidden>'
       +'<button class="btn" data-a="xlapply">Aplicar</button></div>'}
    catch(err){box.innerHTML='<p class="err">No pude leer ese archivo. ¿Es un .xlsx? ('+esc(err.message||err)+')</p>'}}
});

function setSch(on){document.body.classList.toggle('sch',!!on)}
function kbShow(){var q=$('#q');if(!q||document.activeElement!==q)return;var card=q.closest('.card'),bc=$('#bigcard'),top=(bc&&!bc.hidden?bc.getBoundingClientRect().bottom:0)+8;
  if(!card)return;var y=card.getBoundingClientRect().top-top;if(Math.abs(y)>2)window.scrollBy({top:y,behavior:'smooth'})}
function kbPad(){var vv=window.visualViewport;if(!vv)return;var kb=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
  var on=kb>80&&document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  document.body.classList.toggle('kb',!!on);document.documentElement.style.setProperty('--kb',(on?kb:0)+'px')}
document.addEventListener('focusin',function(e){var t=e.target;if(!t||t.tagName!=='INPUT')return;
  if(!t.enterKeyHint)t.enterKeyHint=t.id==='q'?'search':'done';
  if(t.id==='q'){setSch(true);[60,350,700].forEach(function(ms){setTimeout(kbShow,ms)})}
  else if(t.closest&&t.closest('.sheet')&&!t.readOnly){[60,350].forEach(function(ms){setTimeout(function(){if(document.activeElement===t)t.scrollIntoView({block:'center',behavior:'smooth'})},ms)})}
  setTimeout(kbPad,350)});
document.addEventListener('focusout',function(e){var t=e.target;if(t&&t.id==='q'){var rt=e.relatedTarget;setTimeout(function(){if(document.activeElement&&document.activeElement.id==='q')return;if(rt&&rt.closest&&rt.closest('#res,#recent,.sugc'))return;setSch(false)},180)}setTimeout(kbPad,100)});
if(window.visualViewport){visualViewport.addEventListener('resize',function(){kbPad();kbShow()})}
